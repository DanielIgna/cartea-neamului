# Verifică paginile publice pe site-ul live (din containerul de lucru site-ul nu se poate deschide). Pornit manual.
name: verifica-live
on:
  workflow_dispatch:
jobs:
  verifica:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - name: Paginile diaspora, sitemap-urile și comunele publicate de motor
        run: |
          S=https://carteaneamului.ro
          for p in /diaspora /it/diaspora/italia /es/diaspora/spania /de/diaspora/germania /fr/diaspora/franta /he/diaspora/israel /en/diaspora/marea-britanie /en-us/diaspora/statele-unite/ohio /fr/diaspora/canada/montreal /he/diaspora/radacini-evreiesti /de/diaspora/sasi-si-svabi /hu/diaspora/maghiari-din-transilvania /it/diaspora/moldoveni-in-italia-si-israel /diaspora/statele-unite/wyoming; do
            h=$(curl -sL -A "Mozilla/5.0 (compatible; Googlebot/2.1)" "$S$p")
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "Googlebot" "$S$p")
            t=$(echo "$h" | grep -oE '<title>[^<]*' | head -1)
            r=$(echo "$h" | grep -oE '<meta name="robots"[^>]*>' | head -1)
            c=$(echo "$h" | grep -oE '<link rel="canonical"[^>]*>' | head -1)
            echo "$code $p | $t | ${r:-indexabilă} | $c"
          done
          echo "--- sitemap index"
          curl -s $S/sitemap.xml | grep -oE 'sitemaps/[a-z-]+\.xml' | sort | tr '\n' ' '; echo
          for l in ro en it es de fr he hu; do echo "diaspora-$l: $(curl -s $S/sitemaps/diaspora-$l.xml | grep -c '<loc>') adrese"; done
          echo "sitemap-diaspora.xml: $(curl -s $S/sitemap-diaspora.xml | grep -c '<loc>') adrese"
          echo "--- comunele din sitemap-ul de localități (publicate de motor)"
          curl -s $S/sitemaps/localitati.xml > loc.xml
          echo "adrese în total: $(grep -c '<loc>' loc.xml)"
          python3 -c "import re;x=open('loc.xml').read();print('\n'.join(re.findall(r'<loc>([^<]+)</loc>(?:(?!</url>).)*<priority>0.3</priority>',x,re.S)))" > comune.txt
          echo "comune publicate de motor: $(wc -l < comune.txt)"
          for u in $(head -12 comune.txt) $S/localitati/cluj/floresti $S/localitati/timis/giroc; do
            h=$(curl -sL -A "Googlebot" "$u")
            r=$(echo "$h" | grep -oE '<meta name="robots"[^>]*>' | head -1)
            w=$(echo "$h" | sed 's/<[^>]*>/ /g' | wc -w)
            wiki=$(echo "$h" | grep -c "CC BY-SA" || true)
            echo "$u | ${r:-indexabilă} | ~$w cuvinte | wikipedia: $wiki"
          done
