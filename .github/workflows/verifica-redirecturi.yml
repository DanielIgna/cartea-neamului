# Verifică pe site-ul live redirecturile importante pentru Google (planul SEO, 18.11.2026). Pornit manual, după publicare.
# Fiecare adresă trebuie să ajungă la ținta ei într-un singur salt, cu codul așteptat.
name: verifica-redirecturi
on:
  workflow_dispatch:
jobs:
  verifica:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc {0}
    steps:
      - name: www, http, /preturi, bara de la final, limbile fără traducere
        run: |
          fail=0
          check() { # adresa, codul așteptat, ținta așteptată
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" -A "Mozilla/5.0 (compatible; Googlebot/2.1)" "$1")
            code=${out%% *}; loc=${out#* }
            if [ "$code" = "$2" ] && [ "$loc" = "$3" ]; then echo "OK   $1 → $code $loc"; else echo "GREȘIT $1 → $code $loc (așteptat $2 $3)"; fail=1; fi
            # Ținta răspunde direct 200 (un singur salt).
            t=$(curl -s -o /dev/null -w "%{http_code}" -A "Googlebot" "${3%%#*}")
            [ "$t" = "200" ] || { echo "GREȘIT ținta ${3%%#*} → $t"; fail=1; }
          }
          check "http://carteaneamului.ro/" 308 "https://carteaneamului.ro/"
          check "https://www.carteaneamului.ro/" 308 "https://carteaneamului.ro/"
          check "http://www.carteaneamului.ro/nume" 308 "https://carteaneamului.ro/nume"
          check "https://carteaneamului.ro/preturi" 301 "https://carteaneamului.ro/#preturi"
          check "https://carteaneamului.ro/nume/" 308 "https://carteaneamului.ro/nume"
          check "https://carteaneamului.ro/en/nume/clucer" 308 "https://carteaneamului.ro/nume/clucer"
          check "https://carteaneamului.ro/en/ghid" 308 "https://carteaneamului.ro/ghid"
          echo "--- robots.txt"; curl -s https://carteaneamului.ro/robots.txt
          echo "--- RSS"; curl -s -o /dev/null -w "%{http_code} %{content_type}\n" https://carteaneamului.ro/ghid/feed.xml
          echo "--- lastmod în pagini.xml"; curl -s https://carteaneamului.ro/sitemaps/pagini.xml | grep -oE '<lastmod>[^<]+' | sort | uniq -c
          exit $fail
