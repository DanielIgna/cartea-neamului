name: Proba motorului SEO
# Rulează proba pe 20 de pagini (cu Wikipedia, fără bază de date, fără să publice nimic) când se schimbă motorul.
on:
  pull_request:
    paths: ["src/lib/motor-seo/**", "src/lib/continut/uat*.ts", "scripts/proba-motor-seo.ts"]
  workflow_dispatch:
jobs:
  proba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/proba-motor-seo.ts 20 proba.md
      - run: cat proba.md >> "$GITHUB_STEP_SUMMARY"
