<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fără internet · Cartea Neamului</title>
<style>
  :root { --bg: #eef1f2; --surface: #ffffff; --ink: #1b2430; --muted: #5b6673; --line: #d5dbe0; --accent: #1f5fa8; --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1626; --surface: #112136; --ink: #e8eef6; --muted: #9db0c6; --line: #24405f; --accent: #7fb0ea; --on-accent: #0b1626; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 17px/1.5 "Alegreya Sans", "Segoe UI", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; max-width: 420px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font: 700 26px/1.2 "Alegreya", Georgia, serif; margin: 14px 0 8px; }
  p { color: var(--muted); margin: 0 0 18px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 18px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Nu ai internet acum</h1>
  <p>Arborele și amintirile familiei stau la loc sigur. Când telefonul prinde din nou internet, apasă butonul și pagina se deschide.</p>
  <button onclick="location.reload()">Încearcă din nou</button>
</main>
</body>
</html>
