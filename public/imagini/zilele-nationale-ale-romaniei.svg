<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Zilele naționale ale României</title><desc id="d">Trei zile naționale în timp: 10 Mai până în 1947, 23 August între 1948 și 1989, 1 Decembrie din 1990, prin Legea nr. 10/1990.</desc><rect width="1200" height="640" fill="#fffdf8"/><text x="600" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Zilele naționale ale României</text><text x="600" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Fiecare generație din familie are amintirile ei</text><rect x="60" y="150" width="340" height="330" rx="18" fill="#ffffff" stroke="#e7dccb" stroke-width="3"/><text x="230" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#5d7a4a" text-anchor="middle" font-weight="bold">10 Mai</text><text x="230" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#3b2f24" text-anchor="middle" font-weight="bold">până în 1947</text><text x="230" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">o amintesc</text><text x="230" y="376" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">străbunicii</text><rect x="430" y="150" width="340" height="330" rx="18" fill="#ffffff" stroke="#e7dccb" stroke-width="3"/><text x="600" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#6b5a48" text-anchor="middle" font-weight="bold">23 August</text><text x="600" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#3b2f24" text-anchor="middle" font-weight="bold">1948–1989</text><text x="600" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">au trăit-o bunicii</text><text x="600" y="376" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">și părinții</text><rect x="800" y="150" width="340" height="330" rx="18" fill="#ffffff" stroke="#e7dccb" stroke-width="3"/><text x="970" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#b5793a" text-anchor="middle" font-weight="bold">1 Decembrie</text><text x="970" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#3b2f24" text-anchor="middle" font-weight="bold">din 1990</text><text x="970" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">sărbătoarea</text><text x="970" y="376" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">copiilor de azi</text><text x="600" y="610" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Întreabă-i pe cei mai în vârstă ce sărbătoreau ei când erau copii.</text><text x="1180" y="624" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>