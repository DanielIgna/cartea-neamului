<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Unirea în trei pași, 1918</title><desc id="d">Trei pași în 1918: Basarabia, votul Sfatului Țării din 27 martie / 9 aprilie; Bucovina, Congresul General de la Cernăuți din 15/28 noiembrie; Transilvania, Banatul, Crișana și Maramureșul, Marea Adunare de la Alba Iulia din 1 decembrie.</desc><rect width="1200" height="640" fill="#fffdf8"/><text x="600" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Unirea în trei pași, 1918</text><text x="600" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Trei adunări, trei date, o singură țară</text><rect x="60" y="140" width="340" height="380" rx="18" fill="#ffffff" stroke="#b5793a" stroke-width="4"/><circle cx="230" cy="200" r="34" fill="#b5793a"/><text x="230" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="230" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3b2f24" text-anchor="middle" font-weight="bold">Basarabia</text><text x="230" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#b5793a" text-anchor="middle" font-weight="bold">27 mar. / 9 apr.</text><text x="230" y="390" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Sfatul Țării</text><text x="230" y="416" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">votează unirea</text><text x="230" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal">Chișinău</text><rect x="430" y="140" width="340" height="380" rx="18" fill="#ffffff" stroke="#5d7a4a" stroke-width="4"/><circle cx="600" cy="200" r="34" fill="#5d7a4a"/><text x="600" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="600" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3b2f24" text-anchor="middle" font-weight="bold">Bucovina</text><text x="600" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#5d7a4a" text-anchor="middle" font-weight="bold">15/28 noiembrie</text><text x="600" y="390" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Congresul General</text><text x="600" y="416" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">al Bucovinei</text><text x="600" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal">Cernăuți</text><rect x="800" y="140" width="340" height="380" rx="18" fill="#ffffff" stroke="#b5793a" stroke-width="4"/><circle cx="970" cy="200" r="34" fill="#b5793a"/><text x="970" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="970" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3b2f24" text-anchor="middle" font-weight="bold">Transilvania</text><text x="970" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#b5793a" text-anchor="middle" font-weight="bold">1 decembrie</text><text x="970" y="390" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Marea Adunare</text><text x="970" y="416" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Națională</text><text x="970" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal">Alba Iulia</text><text x="600" y="610" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Pasul 3 cuprinde Transilvania, Banatul, Crișana și Maramureșul.</text><text x="1180" y="624" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>