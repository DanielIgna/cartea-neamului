<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Cine sunt cuscrii: părinții mirelui și ai miresei</title><desc id="d">Schemă: părinții mirelui și părinții miresei sunt cuscri între ei; legătura se numește cuscrie. Mirele și mireasa sunt legați prin căsătorie. Legea nu le dă cuscrilor un grad de rudenie.</desc><rect width="1200" height="640" fill="#fffdf8"/><text x="600.0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Cuscrii: cele două perechi de părinți</text><text x="600.0" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Tatăl mirelui și tatăl miresei, mama mirelui și mama miresei</text><path d="M282 230 Q600 360 918 230" fill="none" stroke="#b5793a" stroke-width="3" stroke-dasharray="8 6"/><rect x="470" y="270" width="260" height="40" rx="20" fill="#fffdf8" stroke="#b5793a" stroke-width="2"/><text x="600" y="297" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#b5793a" text-anchor="middle" font-weight="bold">cuscri · cuscrie</text><rect x="50.0" y="140" width="200" height="60" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="150" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Tatăl mirelui</text><rect x="290.0" y="140" width="200" height="60" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="390" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Mama mirelui</text><rect x="710.0" y="140" width="200" height="60" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="810" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Tatăl miresei</text><rect x="950.0" y="140" width="200" height="60" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="1050" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Mama miresei</text><line x1="250" y1="170" x2="290" y2="170" stroke="#c9b79c" stroke-width="3"/><line x1="910" y1="170" x2="970" y2="170" stroke="#c9b79c" stroke-width="3"/><path d="M270 170 V440 H400" fill="none" stroke="#c9b79c" stroke-width="2.5"/><path d="M930 170 V440 H800" fill="none" stroke="#c9b79c" stroke-width="2.5"/><rect x="400.0" y="410" width="180" height="60" rx="14" fill="#efe2c8" stroke="#b5793a" stroke-width="2"/><text x="490" y="446" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="bold">Mirele</text><rect x="620.0" y="410" width="180" height="60" rx="14" fill="#efe2c8" stroke="#b5793a" stroke-width="2"/><text x="710" y="446" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="bold">Mireasa</text><line x1="580" y1="433" x2="620" y2="433" stroke="#b5793a" stroke-width="2.5"/><line x1="580" y1="447" x2="620" y2="447" stroke="#b5793a" stroke-width="2.5"/><text x="600" y="500" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="middle" font-weight="normal">căsătorie</text><text x="600.0" y="556" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal">Legea nu le dă cuscrilor un grad de rudenie. În actul de căsătorie apar însă părinții ambilor soți,</text><text x="600.0" y="580" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal">așa că din el afli cine au fost cuscrii.</text><text x="1180" y="624" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>