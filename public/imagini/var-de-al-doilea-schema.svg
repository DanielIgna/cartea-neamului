<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d"><title id="t">Vărul de-al doilea: schemă cu strămoșii comuni și gradul VI</title><desc id="d">Schemă: tu și vărul de-al doilea aveți aceiași străbunici. Bunicul tău și bunicul lui sunt frați, părinții voștri sunt veri primari. Numărând pașii: părinte 1, bunic 2, străbunici 3, fratele bunicului 4, copilul lui 5, vărul de-al doilea 6, deci gradul VI.</desc><rect width="1200" height="800" fill="#fffdf8"/><text x="600.0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Vărul de-al doilea: aceiași străbunici</text><text x="600.0" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Numeri pașii până la strămoșii comuni și înapoi: gradul VI</text><path d="M600 200 V250 M330 250 H870 M330 250 V300 M870 250 V300" fill="none" stroke="#c9b79c" stroke-width="2.5"/><path d="M330 360 V420 M330 480 V540" fill="none" stroke="#c9b79c" stroke-width="2.5"/><path d="M870 360 V420 M870 480 V540" fill="none" stroke="#c9b79c" stroke-width="2.5"/><rect x="440.0" y="140" width="320" height="60" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="584" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Străbunicii (comuni)</text><circle cx="734.0" cy="170" r="17" fill="#b5793a"/><text x="734.0" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">3</text><rect x="200.0" y="300" width="260" height="60" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="314" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Bunicul tău</text><circle cx="434.0" cy="330" r="17" fill="#b5793a"/><text x="434.0" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">2</text><rect x="740.0" y="300" width="260" height="60" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="854" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Fratele bunicului</text><circle cx="974.0" cy="330" r="17" fill="#b5793a"/><text x="974.0" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">4</text><rect x="200.0" y="420" width="260" height="60" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="314" y="456" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Părintele tău</text><circle cx="434.0" cy="450" r="17" fill="#b5793a"/><text x="434.0" y="456" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">1</text><rect x="720.0" y="420" width="300" height="60" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="854" y="456" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">Vărul primar al părintelui</text><circle cx="994.0" cy="450" r="17" fill="#b5793a"/><text x="994.0" y="456" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">5</text><rect x="200.0" y="540" width="260" height="60" rx="14" fill="#efe2c8" stroke="#b5793a" stroke-width="2.5"/><text x="330" y="576" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="bold">EU</text><rect x="740.0" y="540" width="260" height="60" rx="14" fill="#efe2c8" stroke="#b5793a" stroke-width="2.5"/><text x="854" y="576" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="bold">Vărul de-al doilea</text><circle cx="974.0" cy="570" r="17" fill="#b5793a"/><text x="974.0" y="576" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">6</text><text x="600" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b5793a" text-anchor="middle" font-weight="normal">frați</text><text x="600" y="456" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b5793a" text-anchor="middle" font-weight="normal">veri primari</text><text x="600" y="576" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b5793a" text-anchor="middle" font-weight="bold">veri de-al doilea</text><rect x="150" y="640" width="900" height="90" rx="12" fill="#faf6ee" stroke="#c9b79c" stroke-width="1.5"/><text x="600" y="675" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Atenție: copilul vărului tău primar nu e văr de-al doilea, ci „nepot de văr” (gradul V).</text><text x="600" y="703" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal">„Văr de gradul doi” e o vorbă din popor; după lege, vărul de-al doilea e rudă de gradul VI.</text><text x="1180" y="784" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>