<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Cum arăta un credențional</title><desc id="d">Schema unui credențional din noiembrie 1918: titlul, cercul electoral și comitatul, numele celor cinci delegați, dreptul de vot decisiv, locul și data, semnăturile președintelui, notarului și oamenilor de încredere.</desc><rect width="1200" height="640" fill="#fffdf8"/><text x="600" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Cum arăta un credențional</text><text x="600" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Actul cu care un delegat intra la Marea Adunare</text><rect x="330" y="110" width="540" height="480" rx="6" fill="#fbf4e6" stroke="#b5793a" stroke-width="3"/><text x="600" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3b2f24" text-anchor="middle" font-weight="bold">CREDENȚIONAL</text><text x="600" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#6b5a48" text-anchor="middle" font-weight="normal">Cercul electoral … · Comitatul …</text><line x1="400" y1="245" x2="800" y2="245" stroke="#e7dccb" stroke-width="3"/><text x="390" y="251" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#b5793a" text-anchor="end" font-weight="bold">1.</text><line x1="400" y1="273" x2="800" y2="273" stroke="#e7dccb" stroke-width="3"/><text x="390" y="279" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#b5793a" text-anchor="end" font-weight="bold">2.</text><line x1="400" y1="301" x2="800" y2="301" stroke="#e7dccb" stroke-width="3"/><text x="390" y="307" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#b5793a" text-anchor="end" font-weight="bold">3.</text><line x1="400" y1="329" x2="800" y2="329" stroke="#e7dccb" stroke-width="3"/><text x="390" y="335" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#b5793a" text-anchor="end" font-weight="bold">4.</text><line x1="400" y1="357" x2="800" y2="357" stroke="#e7dccb" stroke-width="3"/><text x="390" y="363" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#b5793a" text-anchor="end" font-weight="bold">5.</text><text x="600" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#3b2f24" text-anchor="middle" font-weight="normal">au dreptul să ia parte „cu vot decisiv”</text><text x="600" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#3b2f24" text-anchor="middle" font-weight="normal">la Marea Adunare Națională</text><text x="600" y="480" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal">Locul și data · noiembrie 1918</text><line x1="380" y1="540" x2="560" y2="540" stroke="#3b2f24" stroke-width="2"/><line x1="640" y1="540" x2="820" y2="540" stroke="#3b2f24" stroke-width="2"/><text x="470" y="565" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="middle" font-weight="normal">președinte</text><text x="730" y="565" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="middle" font-weight="normal">notar, oameni de încredere</text><text x="160" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5d7a4a" text-anchor="middle" font-weight="bold">Cine?</text><text x="160" y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">cei 5 delegați</text><text x="160" y="318" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">aleși în cerc</text><text x="1040" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5d7a4a" text-anchor="middle" font-weight="bold">Unde e azi?</text><text x="1040" y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Muzeul Național</text><text x="1040" y="318" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">al Unirii;</text><text x="1040" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">copii online</text><text x="1040" y="362" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">la BCU Cluj</text><text x="1180" y="624" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>