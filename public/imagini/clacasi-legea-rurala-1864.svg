<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d"><title id="t">Clăcașii: claca, legea rurală din 1864 și fruntași, mijlocași, pălmași</title><desc id="d">Cronologie: Regulamentele Organice (1831 în Țara Românească, 1832 în Moldova) fixează claca la 12 zile pe an; Legea rurală din 1864 desființează claca și dijma. Clăcașii primesc pământ după vitele de muncă: fruntași cu patru boi și o vacă, mijlocași cu doi boi și o vacă, pălmași fără boi.</desc><rect width="1200" height="800" fill="#fffdf8"/><text x="600.0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Clăcașii, de la clacă la pământul lor</text><text x="600.0" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Țara Românească și Moldova, până la legea rurală din 1864</text><line x1="120" y1="200" x2="1080" y2="200" stroke="#b5793a" stroke-width="4"/><circle cx="260" cy="200" r="12" fill="#b5793a"/><text x="260" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3b2f24" text-anchor="middle" font-weight="bold">1831 · 1832</text><text x="260" y="236" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="bold">Regulamentele Organice</text><text x="260" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="middle" font-weight="normal">claca: 12 zile pe an „pe hârtie”</text><circle cx="940" cy="200" r="12" fill="#b5793a"/><text x="940" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3b2f24" text-anchor="middle" font-weight="bold">1864</text><text x="940" y="236" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="bold">Legea rurală (Cuza)</text><text x="940" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="middle" font-weight="normal">claca și dijma desființate</text><text x="600" y="300" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="middle" font-weight="normal">Norma de muncă („nartul”) făcea din cele 12 zile mult mai multe. Pe lângă clacă: dijma, o parte din recoltă.</text><text x="600" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3b2f24" text-anchor="middle" font-weight="bold">În 1864 clăcașii primesc pământ după vitele de muncă, cu despăgubire plătită 15 ani</text><rect x="90" y="390" width="320" height="250" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="250" y="432" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#3b2f24" text-anchor="middle" font-weight="bold">Fruntași</text><ellipse cx="162.0" cy="500" rx="13" ry="11" fill="#3b2f24"/><path d="M151.0 494 q-9 -10 -4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><path d="M173.0 494 q9 -10 4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><ellipse cx="206.0" cy="500" rx="13" ry="11" fill="#3b2f24"/><path d="M195.0 494 q-9 -10 -4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><path d="M217.0 494 q9 -10 4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><ellipse cx="250.0" cy="500" rx="13" ry="11" fill="#3b2f24"/><path d="M239.0 494 q-9 -10 -4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><path d="M261.0 494 q9 -10 4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><ellipse cx="294.0" cy="500" rx="13" ry="11" fill="#3b2f24"/><path d="M283.0 494 q-9 -10 -4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><path d="M305.0 494 q9 -10 4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><ellipse cx="338.0" cy="500" rx="12" ry="10" fill="#b5793a"/><path d="M329.0 494 q-5 -6 -2 -11" fill="none" stroke="#b5793a" stroke-width="2.5"/><path d="M347.0 494 q5 -6 2 -11" fill="none" stroke="#b5793a" stroke-width="2.5"/><text x="250" y="560" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">4 boi și o vacă</text><text x="250" y="596" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="middle" font-weight="normal">cel mai mult pământ</text><rect x="440" y="390" width="320" height="250" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="600" y="432" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#3b2f24" text-anchor="middle" font-weight="bold">Mijlocași</text><ellipse cx="556.0" cy="500" rx="13" ry="11" fill="#3b2f24"/><path d="M545.0 494 q-9 -10 -4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><path d="M567.0 494 q9 -10 4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><ellipse cx="600.0" cy="500" rx="13" ry="11" fill="#3b2f24"/><path d="M589.0 494 q-9 -10 -4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><path d="M611.0 494 q9 -10 4 -16" fill="none" stroke="#3b2f24" stroke-width="3"/><ellipse cx="644.0" cy="500" rx="12" ry="10" fill="#b5793a"/><path d="M635.0 494 q-5 -6 -2 -11" fill="none" stroke="#b5793a" stroke-width="2.5"/><path d="M653.0 494 q5 -6 2 -11" fill="none" stroke="#b5793a" stroke-width="2.5"/><text x="600" y="560" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">2 boi și o vacă</text><text x="600" y="596" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="middle" font-weight="normal">mai puțin pământ</text><rect x="790" y="390" width="320" height="250" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="950" y="432" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#3b2f24" text-anchor="middle" font-weight="bold">Pălmași</text><ellipse cx="950" cy="500" rx="13" ry="11" fill="none" stroke="#6b5a48" stroke-width="2" stroke-dasharray="4 3"/><line x1="932" y1="518" x2="968" y2="482" stroke="#6b5a48" stroke-width="2.5"/><text x="950" y="560" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="middle" font-weight="normal">fără boi</text><text x="950" y="596" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="middle" font-weight="normal">doar brațele de muncă</text><rect x="90" y="670" width="1020" height="66" rx="12" fill="#f8f0e1" stroke="#c9b79c" stroke-width="1.5"/><text x="600" y="700" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Unde îi cauți: catagrafiile din 1831 și 1838, apoi listele de împroprietărire din 1864,</text><text x="600" y="722" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">păstrate la serviciile județene ale Arhivelor Naționale, pe sate.</text><text x="1180" y="784" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>