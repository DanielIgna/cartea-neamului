<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d"><title id="t">Actul de naștere: ce date conține și unde îl găsești</title><desc id="d">Desen al unui registru de născuți cu rubricile: data nașterii, numele copilului, sexul, părinții cu ocupația și locuința, declarantul și martorii, mențiunile de pe margine. Sub 100 de ani actul e la primărie, peste 100 de ani la Arhivele Naționale; actele civile încep din 1865 în Moldova și Țara Românească și din 1895 în Transilvania și Banat.</desc><rect width="1200" height="760" fill="#fffdf8"/><text x="600.0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Actul de naștere: ce găsești pe rând</text><text x="600.0" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Rubricile unui registru de născuți, cu mențiunile scrise mai târziu pe margine</text><rect x="40" y="120" width="1120" height="250" rx="6" fill="#f8f0e1" stroke="#c9b79c" stroke-width="2"/><text x="70.0" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3b2f24" text-anchor="middle" font-weight="bold">Nr.</text><text x="175.0" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3b2f24" text-anchor="middle" font-weight="bold">Data nașterii</text><text x="175.0" y="172" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#9a8a76" text-anchor="middle" font-weight="normal">(și a botezului)</text><line x1="100" y1="120" x2="100" y2="370" stroke="#c9b79c" stroke-width="1.5"/><text x="335.0" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3b2f24" text-anchor="middle" font-weight="bold">Numele copilului</text><line x1="250" y1="120" x2="250" y2="370" stroke="#c9b79c" stroke-width="1.5"/><text x="460.0" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3b2f24" text-anchor="middle" font-weight="bold">Sexul</text><line x1="420" y1="120" x2="420" y2="370" stroke="#c9b79c" stroke-width="1.5"/><text x="615.0" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3b2f24" text-anchor="middle" font-weight="bold">Părinții</text><text x="615.0" y="172" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#9a8a76" text-anchor="middle" font-weight="normal">nume, ocupație, locuință</text><line x1="500" y1="120" x2="500" y2="370" stroke="#c9b79c" stroke-width="1.5"/><text x="820.0" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3b2f24" text-anchor="middle" font-weight="bold">Declarant, martori</text><line x1="730" y1="120" x2="730" y2="370" stroke="#c9b79c" stroke-width="1.5"/><text x="995.0" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3b2f24" text-anchor="middle" font-weight="bold">Mențiuni pe margine</text><text x="995.0" y="172" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#9a8a76" text-anchor="middle" font-weight="normal">căsătorie, deces, nume</text><line x1="910" y1="120" x2="910" y2="370" stroke="#c9b79c" stroke-width="1.5"/><line x1="40" y1="186" x2="1160" y2="186" stroke="#c9b79c" stroke-width="2"/><line x1="40" y1="244" x2="1160" y2="244" stroke="#c9b79c" stroke-width="1" stroke-dasharray="3 4"/><line x1="40" y1="302" x2="1160" y2="302" stroke="#c9b79c" stroke-width="1" stroke-dasharray="3 4"/><line x1="40" y1="360" x2="1160" y2="360" stroke="#c9b79c" stroke-width="1" stroke-dasharray="3 4"/><path d="M1010 210 q20 -8 40 0 t40 0 t40 0" fill="none" stroke="#b5793a" stroke-width="2"/><path d="M1010 230 q20 -8 40 0 t40 0" fill="none" stroke="#b5793a" stroke-width="2"/><text x="600" y="410" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="middle" font-weight="normal">Pe margine pot apărea, scrise mai târziu, căsătoria, decesul sau o schimbare de nume: piste noi.</text><text x="60" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3b2f24" text-anchor="start" font-weight="bold">Unde îl cauți</text><rect x="60" y="480" width="520" height="62" rx="10" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="80" y="506" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#b5793a" text-anchor="start" font-weight="bold">sub ~100 de ani</text><text x="80" y="528" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">primăria locului, serviciul de stare civilă</text><rect x="60" y="558" width="520" height="62" rx="10" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="80" y="584" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#b5793a" text-anchor="start" font-weight="bold">peste ~100 de ani</text><text x="80" y="606" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">Arhivele Naționale, serviciul județean</text><rect x="60" y="636" width="520" height="62" rx="10" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="80" y="662" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#b5793a" text-anchor="start" font-weight="bold">înainte de starea civilă</text><text x="80" y="684" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">botezul, în registrul parohial</text><text x="640" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3b2f24" text-anchor="start" font-weight="bold">De când există actele civile</text><rect x="640" y="480" width="500" height="100" rx="10" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="720" y="544" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#b5793a" text-anchor="middle" font-weight="bold">1865</text><text x="800" y="538" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#3b2f24" text-anchor="start" font-weight="normal">Moldova și Țara Românească</text><rect x="640" y="597" width="500" height="100" rx="10" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="720" y="661" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#b5793a" text-anchor="middle" font-weight="bold">1895</text><text x="800" y="655" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#3b2f24" text-anchor="start" font-weight="normal">Transilvania și Banat</text><text x="1180" y="744" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>