<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d"><title id="t">Patronimic: cum s-au născut numele de familie din numele tatălui</title><desc id="d">Schemă: tatăl Vasile, în actele vechi Ion sin Vasile sau Ion al lui Vasile, apoi nume de familie ca Vasilescu sau Vasiliu. Terminațiile: -escu în Muntenia și Oltenia, -iu în Moldova, -ovici în Banat, Bucovina și nordul Moldovei, -uc în Bucovina și Maramureș, formula „a lui”; -eanu arată mai des un loc.</desc><rect width="1200" height="780" fill="#fffdf8"/><text x="600.0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Patronimicul: numele venit de la tată</text><text x="600.0" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Cum ajunge „fiul lui Vasile” să fie Vasilescu sau Vasiliu</text><rect x="90" y="130" width="300" height="110" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="240" y="165" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b5793a" text-anchor="middle" font-weight="bold">tatăl</text><text x="240" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3b2f24" text-anchor="middle" font-weight="normal">Vasile</text><line x1="395" y1="185" x2="455" y2="185" stroke="#b5793a" stroke-width="2.5"/><path d="M455.0 185.0 L444.2 190.2 L444.2 179.8 Z" fill="#b5793a"/><rect x="460" y="130" width="300" height="110" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="610" y="165" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b5793a" text-anchor="middle" font-weight="bold">în actele vechi</text><text x="610" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3b2f24" text-anchor="middle" font-weight="normal">Ion sin Vasile</text><line x1="765" y1="185" x2="825" y2="185" stroke="#b5793a" stroke-width="2.5"/><path d="M825.0 185.0 L814.2 190.2 L814.2 179.8 Z" fill="#b5793a"/><rect x="830" y="130" width="300" height="110" rx="14" fill="#efe2c8" stroke="#b5793a" stroke-width="2"/><text x="980" y="165" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b5793a" text-anchor="middle" font-weight="bold">mai târziu</text><text x="980" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3b2f24" text-anchor="middle" font-weight="normal">Ion Vasilescu</text><text x="645" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6b5a48" text-anchor="middle" font-weight="normal">sau „Ion al lui Vasile”</text><text x="1015" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6b5a48" text-anchor="middle" font-weight="normal">sau Ion Vasiliu</text><text x="600.0" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3b2f24" text-anchor="middle" font-weight="bold">Terminațiile care arată „fiul lui”</text><rect x="60" y="360" width="340" height="145" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="230" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#b5793a" text-anchor="middle" font-weight="bold">-escu</text><text x="230" y="442" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Muntenia, Oltenia</text><text x="230" y="472" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal" font-style="italic">Ionescu, Petrescu</text><rect x="430" y="360" width="340" height="145" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="600" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#b5793a" text-anchor="middle" font-weight="bold">-iu</text><text x="600" y="442" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Moldova</text><text x="600" y="472" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal" font-style="italic">Vasiliu, Gheorghiu</text><rect x="800" y="360" width="340" height="145" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="970" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#b5793a" text-anchor="middle" font-weight="bold">-ovici / -evici</text><text x="970" y="442" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Banat, Bucovina, nordul Moldovei</text><text x="970" y="472" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal" font-style="italic">Popovici, Petrovici</text><rect x="60" y="530" width="340" height="145" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="230" y="576" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#b5793a" text-anchor="middle" font-weight="bold">-uc / -iuc</text><text x="230" y="612" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Bucovina, Maramureș</text><text x="230" y="642" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal" font-style="italic">Romaniuc, Petriuc</text><rect x="430" y="530" width="340" height="145" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="600" y="576" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#b5793a" text-anchor="middle" font-weight="bold">„a lui”, „al lui”</text><text x="600" y="612" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">formă de sine stătătoare</text><text x="600" y="642" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal" font-style="italic">Petre al lui Ion</text><rect x="800" y="530" width="340" height="145" rx="14" fill="#faf6ee" stroke="#c9b79c" stroke-width="1.5"/><text x="970" y="576" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#6b5a48" text-anchor="middle" font-weight="bold">-eanu / -anu</text><text x="970" y="612" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">arată mai des un loc</text><text x="970" y="642" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal" font-style="italic">Ardeleanu, Munteanu</text><text x="600.0" y="736" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="middle" font-weight="normal">„Ion a Mării” e un matronimic: numele vine de la mamă, nu de la tată.</text><text x="1180" y="764" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>