<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-labelledby="t d"><title id="t">Livret militar: ce scrie în el, pagină cu pagină</title><desc id="d">Desen al unui livret militar deschis, cu rubricile: nume, data și locul nașterii, părinți, semnalmente, unitatea, gradul, încorporarea, lăsarea la vatră, campaniile și ștampila unității, plus pașii de urmat dacă găsești un livret.</desc><rect width="1200" height="730" fill="#fffdf8"/><text x="600.0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Livretul militar: ce scrie în el</text><text x="600.0" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Rubricile obișnuite dintr-un livret vechi și ce faci cu ele</text><rect x="50" y="120" width="660" height="520" rx="8" fill="#f8f0e1" stroke="#c9b79c" stroke-width="2"/><line x1="380" y1="120" x2="380" y2="640" stroke="#c9b79c" stroke-width="2"/><text x="215.0" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3b2f24" text-anchor="middle" font-weight="bold">LIVRET MILITAR</text><text x="70" y="215" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="bold">Numele și prenumele</text><line x1="70" y1="237" x2="360" y2="237" stroke="#c9b79c" stroke-width="1.5" stroke-dasharray="3 4"/><text x="70" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="bold">Data și locul nașterii</text><line x1="70" y1="337" x2="360" y2="337" stroke="#c9b79c" stroke-width="1.5" stroke-dasharray="3 4"/><text x="70" y="415" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="bold">Părinții</text><line x1="70" y1="437" x2="360" y2="437" stroke="#c9b79c" stroke-width="1.5" stroke-dasharray="3 4"/><text x="70" y="455" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#9a8a76" text-anchor="start" font-weight="normal">tatăl, mama</text><text x="70" y="515" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="bold">Semnalmente</text><line x1="70" y1="537" x2="360" y2="537" stroke="#c9b79c" stroke-width="1.5" stroke-dasharray="3 4"/><text x="70" y="555" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#9a8a76" text-anchor="start" font-weight="normal">înălțimea, ochii, părul</text><text x="400" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="bold">Unitatea</text><line x1="400" y1="182" x2="690" y2="182" stroke="#c9b79c" stroke-width="1.5" stroke-dasharray="3 4"/><text x="400" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#9a8a76" text-anchor="start" font-weight="normal">regiment, batalion, companie</text><text x="400" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="bold">Gradul și avansările</text><line x1="400" y1="282" x2="690" y2="282" stroke="#c9b79c" stroke-width="1.5" stroke-dasharray="3 4"/><text x="400" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="bold">Încorporat · Lăsat la vatră</text><line x1="400" y1="382" x2="690" y2="382" stroke="#c9b79c" stroke-width="1.5" stroke-dasharray="3 4"/><text x="400" y="400" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#9a8a76" text-anchor="start" font-weight="normal">anii armatei</text><text x="400" y="460" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="bold">Campanii</text><line x1="400" y1="482" x2="690" y2="482" stroke="#c9b79c" stroke-width="1.5" stroke-dasharray="3 4"/><text x="400" y="500" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#9a8a76" text-anchor="start" font-weight="normal">răni, decorații, prizonierat</text><circle cx="630" cy="578" r="44" fill="none" stroke="#b5793a" stroke-width="2.5" stroke-dasharray="5 4"/><text x="630" y="574" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#b5793a" text-anchor="middle" font-weight="normal">ștampila</text><text x="630" y="590" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#b5793a" text-anchor="middle" font-weight="normal">unității</text><text x="760" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3b2f24" text-anchor="start" font-weight="bold">Dacă ai găsit un livret în casă</text><circle cx="776" cy="189" r="16" fill="#b5793a"/><text x="776" y="195" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="804" y="195.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">Scanează fiecare pagină, cu ștampile și</text><text x="804" y="215.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">însemnări pe margine.</text><circle cx="776" cy="261" r="16" fill="#b5793a"/><text x="776" y="267" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="804" y="267.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">Notează unitatea exact cum e scrisă, cu</text><text x="804" y="287.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">prescurtări cu tot.</text><circle cx="776" cy="333" r="16" fill="#b5793a"/><text x="776" y="339" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="804" y="339.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">Caută istoricul unității: unde și când a</text><text x="804" y="359.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">luptat.</text><circle cx="776" cy="405" r="16" fill="#b5793a"/><text x="776" y="411" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="804" y="411.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">Cere registrul matricol: centrul militar</text><text x="804" y="431.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">județean sau Arhivele Militare de la Pitești.</text><circle cx="776" cy="477" r="16" fill="#b5793a"/><text x="776" y="483" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="804" y="483.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">Trece unitatea, anii și locurile în arborele</text><text x="804" y="503.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">familiei.</text><rect x="760" y="559" width="390" height="96" rx="10" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="776" y="589.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="normal">Semnalmentele sunt adesea singura descriere a</text><text x="776" y="608.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="normal">unui strămoș de care nu avem nicio poză.</text><text x="600.0" y="686" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal">Datele din livret se regăsesc și în registrele matricole, la arhivele militare.</text><text x="1180" y="714" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>