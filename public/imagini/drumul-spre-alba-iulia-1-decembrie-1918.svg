<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Drumul spre Alba Iulia, 1 Decembrie 1918</title><desc id="d">Patru pași ai drumului: plecarea din sat cu delegatul ales, gara satului, trenul spre Alba Iulia, mulțimea pe Câmpul lui Horea și delegații în Sala Unirii.</desc><rect width="1200" height="640" fill="#fffdf8"/><text x="600" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Drumul spre Alba Iulia, 1 Decembrie 1918</text><text x="600" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Un oraș de 10.000 de locuitori a primit 100.000 de oameni</text><rect x="120" y="118" width="960" height="82" rx="14" fill="#ffffff" stroke="#e7dccb" stroke-width="2"/><circle cx="170" cy="159.0" r="22" fill="#b5793a"/><text x="170" y="166.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="215" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#3b2f24" text-anchor="start" font-weight="bold">Plecarea din sat</text><text x="215" y="172" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="start" font-weight="normal">Satul își alege delegații; mulți pleacă împreună, îmbrăcați de sărbătoare</text><rect x="120" y="208" width="960" height="82" rx="14" fill="#ffffff" stroke="#e7dccb" stroke-width="2"/><circle cx="170" cy="249.0" r="22" fill="#5d7a4a"/><text x="170" y="256.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="215" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#3b2f24" text-anchor="start" font-weight="bold">La gara satului</text><text x="215" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="start" font-weight="normal">Uneori tot satul ieșea la gară, cu drapele și panglici tricolore</text><rect x="120" y="298" width="960" height="82" rx="14" fill="#ffffff" stroke="#e7dccb" stroke-width="2"/><circle cx="170" cy="339.0" r="22" fill="#b5793a"/><text x="170" y="346.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="215" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#3b2f24" text-anchor="start" font-weight="bold">Cu trenul spre Alba Iulia</text><text x="215" y="352" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="start" font-weight="normal">Gara bună a fost unul dintre motivele alegerii orașului</text><rect x="120" y="388" width="960" height="82" rx="14" fill="#ffffff" stroke="#e7dccb" stroke-width="2"/><circle cx="170" cy="429.0" r="22" fill="#5d7a4a"/><text x="170" y="436.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="215" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#3b2f24" text-anchor="start" font-weight="bold">Pe Câmpul lui Horea</text><text x="215" y="442" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="start" font-weight="normal">Aproximativ 100.000 de oameni așteaptă vestea, în ger</text><rect x="120" y="478" width="960" height="82" rx="14" fill="#ffffff" stroke="#e7dccb" stroke-width="2"/><circle cx="170" cy="519.0" r="22" fill="#b5793a"/><text x="170" y="526.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="215" y="508" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#3b2f24" text-anchor="start" font-weight="bold">În Sala Unirii</text><text x="215" y="532" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="start" font-weight="normal">Doar cei 1.228 de delegați, cu credențional, intră la vot</text><text x="1180" y="624" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>