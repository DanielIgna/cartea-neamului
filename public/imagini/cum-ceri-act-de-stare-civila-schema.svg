<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d"><title id="t">Unde ceri un act de stare civilă: primărie, Arhive sau registrul parohial</title><desc id="d">Schemă de decizie: dacă actul are sub aproximativ 100 de ani îl ceri la serviciul de stare civilă al primăriei; dacă are peste 100 de ani, la serviciul județean al Arhivelor Naționale; înainte de starea civilă (1865 în Moldova și Țara Românească, 1895 în Transilvania și Banat) cauți în registrele parohiale. Plus cele șase lucruri de scris în cerere.</desc><rect width="1200" height="780" fill="#fffdf8"/><text x="600.0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Unde ceri un act de stare civilă</text><text x="600.0" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Primul lucru de lămurit e vârsta actului</text><rect x="420" y="115" width="360" height="64" rx="32" fill="#efe2c8" stroke="#b5793a" stroke-width="2.5"/><text x="600" y="154" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#3b2f24" text-anchor="middle" font-weight="bold">Cât de vechi e actul?</text><path d="M600 179 V215 H210 V262" fill="none" stroke="#b5793a" stroke-width="2.5"/><path d="M203 256 L217 256 L210 268 Z" fill="#b5793a"/><rect x="40" y="272" width="340" height="170" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="210" y="304" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b5793a" text-anchor="middle" font-weight="bold">sub ~100 de ani</text><text x="210" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#3b2f24" text-anchor="middle" font-weight="bold">Primăria</text><text x="210" y="378" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">serviciul de stare civilă</text><text x="210" y="404" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6b5a48" text-anchor="middle" font-weight="normal">unde s-a înregistrat</text><path d="M600 179 V215 H600 V262" fill="none" stroke="#b5793a" stroke-width="2.5"/><path d="M593 256 L607 256 L600 268 Z" fill="#b5793a"/><rect x="430" y="272" width="340" height="170" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="600" y="304" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b5793a" text-anchor="middle" font-weight="bold">peste ~100 de ani</text><text x="600" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#3b2f24" text-anchor="middle" font-weight="bold">Arhivele Naționale</text><text x="600" y="378" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">serviciul județean</text><text x="600" y="404" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6b5a48" text-anchor="middle" font-weight="normal">copii sau sala de studiu</text><path d="M600 179 V215 H990 V262" fill="none" stroke="#b5793a" stroke-width="2.5"/><path d="M983 256 L997 256 L990 268 Z" fill="#b5793a"/><rect x="820" y="272" width="340" height="170" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="990" y="304" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b5793a" text-anchor="middle" font-weight="bold">înainte de starea civilă</text><text x="990" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#3b2f24" text-anchor="middle" font-weight="bold">Registrul parohial</text><text x="990" y="378" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">botez, cununie, înmormântare</text><text x="990" y="404" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6b5a48" text-anchor="middle" font-weight="normal">înainte de 1865 / 1895 *</text><text x="1160" y="466" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6b5a48" text-anchor="end" font-weight="normal">* 1865 Moldova și Țara Românească · 1895 Transilvania și Banat</text><rect x="40" y="500" width="1120" height="240" rx="14" fill="#faf6ee" stroke="#c9b79c" stroke-width="1.5"/><text x="70" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3b2f24" text-anchor="start" font-weight="bold">Ce scrii în cerere</text><circle cx="84" cy="582" r="14" fill="#b5793a"/><text x="84" y="587" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="110" y="588" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">numele complet (la femei și numele de fată)</text><circle cx="84" cy="630" r="14" fill="#b5793a"/><text x="84" y="635" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="110" y="636" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">tipul actului: naștere, căsătorie, deces</text><circle cx="84" cy="678" r="14" fill="#b5793a"/><text x="84" y="683" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="110" y="684" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">localitatea și, dacă știi, confesiunea</text><circle cx="629" cy="582" r="14" fill="#b5793a"/><text x="629" y="587" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="655" y="588" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">anul sau un interval scurt de ani</text><circle cx="629" cy="630" r="14" fill="#b5793a"/><text x="629" y="635" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="655" y="636" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">numele părinților, dacă le știi</text><circle cx="629" cy="678" r="14" fill="#b5793a"/><text x="629" y="683" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">6</text><text x="655" y="684" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">legătura ta cu persoana și scopul cererii</text><text x="1180" y="764" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>