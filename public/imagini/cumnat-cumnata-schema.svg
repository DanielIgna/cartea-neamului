<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d"><title id="t">Cine e cumnatul și cumnata: schemă de rudenie prin alianță</title><desc id="d">Schemă: cumnat îi spui fratelui soției și soțului surorii tale; cumnată, surorii soției și soției fratelui tău. Toți sunt rude prin alianță (afini) de gradul II, nu rude de sânge.</desc><rect width="1200" height="690" fill="#fffdf8"/><text x="600.0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Cumnatul și cumnata, pe schemă</text><text x="600.0" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Rude prin alianță (afini) de gradul II, nu rude de sânge</text><rect x="215.0" y="138" width="170" height="64" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="300" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Părinții mei</text><rect x="815.0" y="138" width="170" height="64" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="900" y="168" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Socrii</text><text x="900" y="189" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6b5a48" text-anchor="middle" font-weight="normal">părinții soției</text><path d="M300 202 V250 M110 250 H500" fill="none" stroke="#c9b79c" stroke-width="2.5"/><line x1="110" y1="250" x2="110" y2="298" stroke="#c9b79c" stroke-width="2.5"/><line x1="300" y1="250" x2="300" y2="298" stroke="#c9b79c" stroke-width="2.5"/><line x1="500" y1="250" x2="500" y2="298" stroke="#c9b79c" stroke-width="2.5"/><path d="M900 202 V250 M700 250 H1085" fill="none" stroke="#c9b79c" stroke-width="2.5"/><line x1="700" y1="250" x2="700" y2="298" stroke="#c9b79c" stroke-width="2.5"/><line x1="895" y1="250" x2="895" y2="298" stroke="#c9b79c" stroke-width="2.5"/><line x1="1085" y1="250" x2="1085" y2="298" stroke="#c9b79c" stroke-width="2.5"/><rect x="25.0" y="298" width="170" height="64" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="110" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Sora mea</text><rect x="215.0" y="298" width="170" height="64" rx="14" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><text x="300" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Fratele meu</text><rect x="415.0" y="298" width="170" height="64" rx="14" fill="#efe2c8" stroke="#b5793a" stroke-width="2.5"/><text x="500" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="bold">EU</text><rect x="615.0" y="298" width="170" height="64" rx="14" fill="#efe2c8" stroke="#b5793a" stroke-width="2.5"/><text x="700" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="bold">Soția</text><rect x="810.0" y="298" width="170" height="64" rx="14" fill="#fbf3e6" stroke="#b5793a" stroke-width="2.5"/><text x="895" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="bold">Cumnat</text><text x="895" y="349" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b5793a" text-anchor="middle" font-weight="normal">fratele soției</text><rect x="1000.0" y="298" width="170" height="64" rx="14" fill="#fbf3e6" stroke="#b5793a" stroke-width="2.5"/><text x="1085" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="bold">Cumnată</text><text x="1085" y="349" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b5793a" text-anchor="middle" font-weight="normal">sora soției</text><line x1="586" y1="322" x2="614" y2="322" stroke="#b5793a" stroke-width="2.5"/><line x1="586" y1="338" x2="614" y2="338" stroke="#b5793a" stroke-width="2.5"/><line x1="102" y1="362" x2="102" y2="438" stroke="#b5793a" stroke-width="2.5"/><line x1="118" y1="362" x2="118" y2="438" stroke="#b5793a" stroke-width="2.5"/><rect x="25.0" y="438" width="170" height="64" rx="14" fill="#fbf3e6" stroke="#b5793a" stroke-width="2.5"/><text x="110" y="468" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="bold">Cumnat</text><text x="110" y="489" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b5793a" text-anchor="middle" font-weight="normal">soțul surorii mele</text><line x1="292" y1="362" x2="292" y2="438" stroke="#b5793a" stroke-width="2.5"/><line x1="308" y1="362" x2="308" y2="438" stroke="#b5793a" stroke-width="2.5"/><rect x="215.0" y="438" width="170" height="64" rx="14" fill="#fbf3e6" stroke="#b5793a" stroke-width="2.5"/><text x="300" y="468" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="bold">Cumnată</text><text x="300" y="489" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b5793a" text-anchor="middle" font-weight="normal">soția fratelui meu</text><rect x="470" y="420" width="690" height="170" rx="12" fill="#faf6ee" stroke="#c9b79c" stroke-width="1.5"/><text x="490" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="bold">Cumnat sau cumnată îi spui:</text><text x="490" y="480" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">• fratelui sau surorii soției (ori a soțului);</text><text x="490" y="508" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="start" font-weight="normal">• soțului surorii tale și soției fratelui tău.</text><text x="490" y="536" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="start" font-weight="normal">Doi bărbați căsătoriți cu două surori își spun tot</text><text x="490" y="564" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="start" font-weight="normal">„cumnați”, deși legea nu-i socotește afini între ei.</text><text x="600.0" y="640" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal">Linia dublă = căsătorie. Cumnații nu sunt rude de sânge, dar copiii voștri pot fi veri primari.</text><text x="1180" y="674" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>