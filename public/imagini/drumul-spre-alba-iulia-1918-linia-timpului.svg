<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">De la Oradea și Arad la Alba Iulia</title><desc id="d">Linia timpului: 12 octombrie 1918 la Oradea, 30 octombrie Cicio-Pop președinte, 13–15 noiembrie tratativele de la Arad, 20 noiembrie chemarea, 1 decembrie Marea Adunare, 2 decembrie Consiliul Dirigent.</desc><rect width="1200" height="640" fill="#fffdf8"/><text x="600" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">De la Oradea și Arad la Alba Iulia</text><text x="600" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Toamna anului 1918, pas cu pas</text><line x1="110" y1="330" x2="1090" y2="330" stroke="#e7dccb" stroke-width="6" stroke-linecap="round"/><circle cx="110.0" cy="330" r="16" fill="#b5793a"/><text x="110.0" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#b5793a" text-anchor="middle" font-weight="bold">12 oct.</text><text x="110.0" y="218" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Întâlnirea de</text><text x="110.0" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">la Oradea</text><circle cx="306.0" cy="330" r="16" fill="#5d7a4a"/><text x="306.0" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#5d7a4a" text-anchor="middle" font-weight="bold">30 oct.</text><text x="306.0" y="430" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Cicio-Pop, președinte</text><text x="306.0" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">al Consiliului</text><circle cx="502.0" cy="330" r="16" fill="#b5793a"/><text x="502.0" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#b5793a" text-anchor="middle" font-weight="bold">13–15 nov.</text><text x="502.0" y="218" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Tratativele</text><text x="502.0" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">de la Arad</text><circle cx="698.0" cy="330" r="16" fill="#5d7a4a"/><text x="698.0" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#5d7a4a" text-anchor="middle" font-weight="bold">20 nov.</text><text x="698.0" y="430" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Chemarea la</text><text x="698.0" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Marea Adunare</text><circle cx="894.0" cy="330" r="16" fill="#b5793a"/><text x="894.0" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#b5793a" text-anchor="middle" font-weight="bold">1 dec.</text><text x="894.0" y="218" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Marea Adunare</text><text x="894.0" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">de la Alba Iulia</text><circle cx="1090.0" cy="330" r="16" fill="#5d7a4a"/><text x="1090.0" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#5d7a4a" text-anchor="middle" font-weight="bold">2 dec.</text><text x="1090.0" y="430" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Consiliul</text><text x="1090.0" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#3b2f24" text-anchor="middle" font-weight="normal">Dirigent</text><text x="600" y="610" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Comitetul de la Arad, condus de Vasile Goldiș, a pregătit totul în câteva săptămâni.</text><text x="1180" y="624" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>