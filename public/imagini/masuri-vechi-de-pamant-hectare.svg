<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d"><title id="t">Măsuri vechi de pământ în hectare: falce, jugăr, pogon</title><desc id="d">Comparație: o falce are aproximativ 1,43 ha, un hectar 1 ha, un jugăr 0,58 ha, un pogon 0,50 ha.</desc><rect width="1200" height="620" fill="#fffdf8"/><text x="600.0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Măsurile vechi de pământ, în hectare</text><text x="600.0" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Suprafață aproximativă; fiecare provincie își avea măsura ei</text><text x="40" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3b2f24" text-anchor="start" font-weight="bold">Falce</text><text x="40" y="206" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="normal">Moldova</text><rect x="300" y="152" width="744.6" height="60" rx="8" fill="#b5793a" opacity="0.85"/><text x="1060.6399999999999" y="190" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#3b2f24" text-anchor="start" font-weight="bold">1,43 ha</text><text x="40" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3b2f24" text-anchor="start" font-weight="bold">Hectar</text><text x="40" y="311" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="normal">măsura de azi</text><rect x="300" y="257" width="520.0" height="60" rx="8" fill="#5d7a4a" opacity="0.55"/><text x="836.0" y="295" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#3b2f24" text-anchor="start" font-weight="bold">1 ha</text><text x="40" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3b2f24" text-anchor="start" font-weight="bold">Jugăr</text><text x="40" y="416" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="normal">Transilvania, Banat</text><rect x="300" y="362" width="299.3" height="60" rx="8" fill="#b5793a" opacity="0.85"/><text x="615.26" y="400" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#3b2f24" text-anchor="start" font-weight="bold">0,58 ha</text><text x="40" y="495" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#3b2f24" text-anchor="start" font-weight="bold">Pogon</text><text x="40" y="521" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b5a48" text-anchor="start" font-weight="normal">Muntenia, Oltenia</text><rect x="300" y="467" width="260.6" height="60" rx="8" fill="#b5793a" opacity="0.85"/><text x="576.624" y="505" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#3b2f24" text-anchor="start" font-weight="bold">0,50 ha</text><text x="600.0" y="590" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Ca să afli hectarele: fălci × 1,43 · jugăre × 0,58 · pogoane × 0,50</text><text x="1180" y="604" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>