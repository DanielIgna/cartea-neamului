<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d"><title id="t">Dosarul de la Securitate al bunicului: pașii pentru cererea la CNSAS</title><desc id="d">Trei pași: strânge datele (numele cu variante, data și locul nașterii, părinții, localitățile, ce știe familia), dovedește rudenia (certificatul de deces și actele de naștere care leagă generațiile), depune cererea pe formularul CNSAS. Apoi CNSAS caută și te anunță; studiezi dosarul în sala de studiu sau ceri copii.</desc><rect width="1200" height="760" fill="#fffdf8"/><text x="600.0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3b2f24" text-anchor="middle" font-weight="bold">Dosarul bunicului la CNSAS, în trei pași</text><text x="600.0" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b5a48" text-anchor="middle" font-weight="normal">Arhivele fostei Securități, administrate din 1999 de CNSAS</text><rect x="50" y="130" width="330" height="330" rx="16" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><circle cx="94" cy="178" r="24" fill="#b5793a"/><text x="94" y="186" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="130" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3b2f24" text-anchor="start" font-weight="bold">Strânge datele</text><text x="80" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">•</text><text x="98" y="240.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">numele, cu variante</text><text x="80" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">•</text><text x="98" y="280.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">data și locul nașterii</text><text x="80" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">•</text><text x="98" y="320.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">numele părinților</text><text x="80" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">•</text><text x="98" y="360.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">localitățile unde a trăit</text><text x="80" y="400" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">•</text><text x="98" y="400.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">ce știe familia</text><line x1="386" y1="295" x2="434" y2="295" stroke="#b5793a" stroke-width="2.5"/><path d="M434.0 295.0 L423.2 300.2 L423.2 289.8 Z" fill="#b5793a"/><rect x="440" y="130" width="330" height="330" rx="16" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><circle cx="484" cy="178" r="24" fill="#b5793a"/><text x="484" y="186" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="520" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3b2f24" text-anchor="start" font-weight="bold">Dovedește rudenia</text><text x="470" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">•</text><text x="488" y="240.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">certificatul lui de deces</text><text x="470" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">•</text><text x="488" y="280.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">actele de naștere care leagă</text><text x="488" y="302.1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">generațiile până la tine</text><line x1="776" y1="295" x2="824" y2="295" stroke="#b5793a" stroke-width="2.5"/><path d="M824.0 295.0 L813.2 300.2 L813.2 289.8 Z" fill="#b5793a"/><rect x="830" y="130" width="330" height="330" rx="16" fill="#f4ead8" stroke="#c9b79c" stroke-width="1.5"/><circle cx="874" cy="178" r="24" fill="#b5793a"/><text x="874" y="186" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="910" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#3b2f24" text-anchor="start" font-weight="bold">Depune cererea</text><text x="860" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">•</text><text x="878" y="240.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">formularul publicat de CNSAS</text><text x="860" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">•</text><text x="878" y="280.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">copii ale actelor</text><text x="860" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">•</text><text x="878" y="320.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">verifică întâi lista celor</text><text x="878" y="342.1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#3b2f24" text-anchor="start" font-weight="normal">care pot cere</text><rect x="50" y="490" width="1100" height="90" rx="14" fill="#efe2c8" stroke="#b5793a" stroke-width="2"/><text x="600" y="528" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#3b2f24" text-anchor="middle" font-weight="bold">Apoi: CNSAS caută în arhivă și te anunță dacă există documente.</text><text x="600" y="558" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b5a48" text-anchor="middle" font-weight="normal">Le studiezi în sala de studiu sau ceri copii. Răspunsul poate dura; continuă cercetarea între timp.</text><text x="600" y="622" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#3b2f24" text-anchor="middle" font-weight="bold">Ce poate fi într-un dosar</text><rect x="125" y="640" width="220" height="44" rx="22" fill="#faf6ee" stroke="#c9b79c" stroke-width="1.5"/><text x="235.0" y="668" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#3b2f24" text-anchor="middle" font-weight="normal">urmărire informativă</text><rect x="375" y="640" width="160" height="44" rx="22" fill="#faf6ee" stroke="#c9b79c" stroke-width="1.5"/><text x="455.0" y="668" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#3b2f24" text-anchor="middle" font-weight="normal">dosar penal</text><rect x="565" y="640" width="310" height="44" rx="22" fill="#faf6ee" stroke="#c9b79c" stroke-width="1.5"/><text x="720.0" y="668" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#3b2f24" text-anchor="middle" font-weight="normal">deportare, domiciliu obligatoriu</text><rect x="905" y="640" width="170" height="44" rx="22" fill="#faf6ee" stroke="#c9b79c" stroke-width="1.5"/><text x="990.0" y="668" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#3b2f24" text-anchor="middle" font-weight="normal">fișe personale</text><text x="1180" y="744" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b5793a" text-anchor="end" font-weight="normal">carteaneamului.ro</text></svg>